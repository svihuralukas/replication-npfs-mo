[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "npfsmo"
version = "0.1.0"
description = "Replikácia IGA pre flow shop s chýbajúcimi operáciami (Ritt & Rossit, 2024)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
